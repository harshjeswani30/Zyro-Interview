appId: com.zyro.adminpanel
productName: Zyro Admin Panel

directories:
  buildResources: build
  output: release

files:
  - out/**/*

extraResources:
  - from: .env
    to: .env

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
