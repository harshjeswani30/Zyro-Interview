name: Build Mac Desktop App

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'electron-builder.yml'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build macOS App
        run: pnpm build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed for electron-builder publish if configured

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: Zyro-Mac-App
          path: dist/*.dmg
          
      - name: Upload Mac ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Zyro-Mac-App-ZIP
          path: dist/*.zip
