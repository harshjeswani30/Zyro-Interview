name: Build Desktop App

on:
  # Pushes to main are handled by release.yml (which builds + releases).
  # This workflow stays for PR validation and manual runs.
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Configure pnpm for universal mac build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          printf 'supported-architectures[os][]=current\nsupported-architectures[os][]=darwin\nsupported-architectures[cpu][]=current\nsupported-architectures[cpu][]=x64\nsupported-architectures[cpu][]=arm64\n' >> .npmrc
          cat .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # --publish never: the github publish config targets a separate downloads
      # repo and needs a PAT we don't have in CI; artifacts are uploaded below.
      # electron-builder is invoked via pnpm exec (not through the package.json
      # script) so --publish reaches it — `pnpm run x -- --flag` forwards the
      # literal "--" and the flag gets ignored.
      - name: Build and package application (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --mac --publish never

      - name: Build and package application (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pnpm run typecheck
          pnpm exec electron-vite build
          pnpm exec electron-builder --win --publish never

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: zyro-desktop-mac
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: zyro-desktop-windows
          path: |
            dist/*.exe
