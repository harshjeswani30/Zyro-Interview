appId: com.zyro.supportclient
productName: Zyro Support Agent Client

directories:
  buildResources: build
  output: release

files:
  - out/**/*

# SECURITY (audit C2): never bundle .env into installers — it holds the
# Supabase service_role key, admin password and provider keys. The packaged
# app loads credentials at runtime from the user's own machine (or an
# operator-provided location), not from the install directory.
extraResources: []

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
