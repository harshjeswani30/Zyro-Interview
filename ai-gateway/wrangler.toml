name = "ai-gateway"
main = "src/index.ts"
compatibility_date = "2024-03-17"

[ai]
binding = "AI"

# KV namespace for instant token revocation.
# Create with: npx wrangler kv namespace create GATEWAY_REVOKED_KV
# Then replace the id below with the one printed by that command.
[[kv_namespaces]]
binding = "GATEWAY_REVOKED_KV"
id = "3c1b2d04460b48258cc9af97053b71c3"

# Secrets (set via: npx wrangler secret put GATEWAY_HMAC_SECRET)
# GATEWAY_HMAC_SECRET — must match the same secret in the Supabase Edge Function
