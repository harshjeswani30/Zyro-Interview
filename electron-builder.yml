appId: com.security.hp
# Brand name for user-facing surfaces (Finder/Spotlight, installer metadata).
# Process-list stealth ("AppService" in Task Manager / Activity Monitor) is
# applied by build/after-pack.js (macOS) and build/after-sign.js (Windows) —
# see their header comments.
productName: Zyro-Ai
afterPack: build/after-pack.js
afterSign: build/after-sign.js
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
  - node_modules/**/*
asar: true
asarUnpack:
  - resources/**
  - "**/node_modules/koffi/**"
  - "**/node_modules/@napi-rs/**"
win:
  executableName: AppService
  target:
    - nsis
  icon: build/icon.ico
nsis:
  # Pinned so the installer filename stays "AppService-Setup-x.y.z.exe" now
  # that productName is the brand — the website download hook and released
  # latest.yml feeds reference this exact name.
  artifactName: AppService-Setup-${version}.${ext}
  shortcutName: Zyro-Ai
  uninstallDisplayName: Zyro-Ai
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: true
  unicode: true
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  # koffi is Windows-only (user32.dll FFI) — its darwin native modules break
  # universal builds (x64/arm64 merge conflict in @electron/universal)
  files:
    - "!**/node_modules/koffi/**"
    - "!**/node_modules/@koromix/**"
  # pnpm installs native packages per-runner-arch; with both darwin variants
  # present (CI installs them via .npmrc supported-architectures) the two
  # arch-specific variants are identical across the x64/arm64 temp builds,
  # which @electron/universal rejects unless allow-listed here. At runtime
  # @napi-rs resolves the right variant via process.arch.
  x64ArchFiles: "**/node_modules/**"
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: harshjeswani30
  repo: Zyro-Ai-Downloads
  releaseType: release
protocols:
  name: zyroapp
  schemes:
    - zyroapp
